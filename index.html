<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizza Hut Living Menu</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 10%,#522219,#180c08 58%,#080504);color:#fff;min-height:100vh;display:grid;place-items:center}.wrap{width:min(1120px,94vw);text-align:center;padding:65px 0}.brand{font-weight:950;font-size:clamp(38px,7vw,82px);letter-spacing:-3px}.brand span{background:#e31837;padding:.04em .2em;border-radius:50% 50% 10% 10%}.sub{opacity:.8;margin:14px auto 28px}.menu{background:linear-gradient(135deg,#fff8e8,#ead9b9);color:#21140e;border-radius:28px;padding:28px;box-shadow:0 35px 100px #000b;overflow:hidden;min-height:610px}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tabs button,.cta{border:0;border-radius:999px;padding:12px 18px;font-weight:900;cursor:pointer}.tabs button{background:#fff9}.tabs button.active,.cta{background:#e31837;color:#fff}.stage{height:355px;display:grid;place-items:center;perspective:900px}.food{width:min(500px,82vw);height:320px;object-fit:cover;border-radius:24px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 25px 18px #0006);transition:.35s}.name{font-size:clamp(28px,4vw,40px);font-weight:950}.price{font-size:22px;margin:7px}.options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px}.options button{padding:9px 13px;border:1px solid #cbb895;background:#fff9;border-radius:10px;cursor:pointer}.cart{position:fixed;z-index:9;right:18px;top:18px;background:#fff;color:#222;padding:12px 16px;border-radius:999px;font-weight:900}.note{font-size:11px;opacity:.55;margin-top:14px}@keyframes float{50%{transform:translateY(-15px) rotate(1deg)}}@media(max-width:600px){.menu{padding:18px 10px;min-height:570px}.stage{height:310px}.food{height:280px}.cart{top:auto;bottom:14px}.brand{letter-spacing:-1px}}</style></head><body><div class="cart">Bag: <b id="count">0</b> · ₱<b id="total">0</b></div><main class="wrap"><div class="brand"><span>PIZZA HUT</span></div><p class="sub">YOUR MENU JUST CAME TO LIFE. Tap a category and watch real food photography rise from the page.</p><section class="menu"><div class="tabs" id="tabs"></div><div class="stage"><img class="food" id="food" alt="Food photograph"></div><div class="name" id="name"></div><div class="price">₱<span id="price"></span></div><div class="options"><button>Regular</button><button>Large</button><button>Stuffed Crust</button><button>Extra Cheese</button></div><button class="cta" id="add">ADD TO BAG</button><div class="note">Interactive concept prototype · photography is illustrative</div></section></main><script>const items=[["Pizza","https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=1100&q=85","Pepperoni Pizza",399],["Pasta","https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=1100&q=85","Creamy Pasta",249],["WingStreet®","https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=1100&q=85","Glazed Wings",299],["Chicken & Sides","https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=1100&q=85","Crispy Chicken",269],["Beverages","https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=1100&q=85","Ice Cold Drink",89],["Deals","https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=1100&q=85","Family Pizza Deal",799]];let cur=0,count=0,total=0;const tabs=document.querySelector("#tabs"),food=document.querySelector("#food"),nameEl=document.querySelector("#name"),price=document.querySelector("#price"),add=document.querySelector("#add");function render(){tabs.innerHTML="";items.forEach((x,i)=>{const b=document.createElement("button");b.textContent=x[0];b.className=i===cur?"active":"";b.onclick=()=>{cur=i;render();food.animate([{opacity:0,transform:"translateY(35px) scale(.8)"},{opacity:1,transform:"translateY(0) scale(1)"}],{duration:550})};tabs.appendChild(b)});food.src=items[cur][1];nameEl.textContent=items[cur][2];price.textContent=items[cur][3]}add.onclick=()=>{count++;total+=items[cur][3];document.querySelector("#count").textContent=count;document.querySelector("#total").textContent=total;food.animate([{transform:"scale(1)"},{transform:"scale(.7) translate(35vw,-35vh)"},{transform:"scale(1)"}],{duration:650})};render()</script></body></html>
