<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizza Hut Living Menu</title><style>body{margin:0;font-family:Arial,sans-serif;background:#17110d;color:#fff;min-height:100vh;display:grid;place-items:center}.wrap{width:min(1100px,94vw);text-align:center}.brand{font-weight:900;font-size:clamp(36px,7vw,84px);letter-spacing:-3px}.brand span{background:#e31837;padding:.05em .22em;border-radius:50% 50% 12% 12%}.sub{opacity:.75;margin:16px auto 28px}.menu{position:relative;background:#f6eddb;color:#241811;border-radius:24px;padding:32px;box-shadow:0 30px 80px #0009;overflow:hidden}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tabs button,.cta{border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}.tabs button.active,.cta{background:#e31837;color:#fff}.food{font-size:clamp(90px,18vw,190px);animation:float 3s ease-in-out infinite;filter:drop-shadow(0 24px 18px #0004);margin:20px}.name{font-size:32px;font-weight:900}.price{font-size:22px;margin:8px}.options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px}.options button{padding:9px 13px;border:1px solid #cab99c;background:#fff9;border-radius:10px;cursor:pointer}.cart{position:fixed;right:18px;top:18px;background:#fff;color:#222;padding:12px 16px;border-radius:999px;font-weight:800}@keyframes float{50%{transform:translateY(-16px) rotate(2deg)}}@media(max-width:600px){.menu{padding:22px 14px}.cart{top:auto;bottom:14px}.brand{letter-spacing:-1px}}</style></head><body><div class="cart">Bag: <b id="count">0</b> · ₱<b id="total">0</b></div><main class="wrap"><div class="brand"><span>PIZZA HUT</span></div><p class="sub">YOUR MENU JUST CAME TO LIFE. Swipe, tap and build your order.</p><section class="menu"><div class="tabs" id="tabs"></div><div class="food" id="food">🍕</div><div class="name" id="name">Pepperoni Pizza</div><div class="price">₱<span id="price">399</span></div><div class="options"><button>Regular</button><button>Large</button><button>Stuffed Crust</button><button>Extra Cheese</button></div><button class="cta" id="add">ADD TO BAG</button></section></main><script>const items=[["Pizza","🍕","Pepperoni Pizza",399],["Pasta","🍝","Creamy Pasta",249],["Wings","🍗","Crispy Wings",299],["Sides","🍟","Loaded Sides",169],["Drinks","🥤","Ice Cold Drink",89],["Deals","🍕","Family Feast Deal",799]];let cur=0,count=0,total=0;const tabs=document.querySelector("#tabs");function render(){tabs.innerHTML="";items.forEach((x,i)=>{let b=document.createElement("button");b.textContent=x[0];b.className=i===cur?"active":"";b.onclick=()=>{cur=i;render()};tabs.appendChild(b)});food.textContent=items[cur][1];name.textContent=items[cur][2];price.textContent=items[cur][3]}add.onclick=()=>{count++;total+=items[cur][3];document.querySelector("#count").textContent=count;document.querySelector("#total").textContent=total;food.animate([{transform:"scale(1)"},{transform:"scale(.72) translate(30vw,-30vh)"},{transform:"scale(1)"}],{duration:650})};render()</script></body></html>
